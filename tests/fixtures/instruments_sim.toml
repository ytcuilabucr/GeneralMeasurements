# Instrument config with every instrument simulated: for trying the Instrument
# Server and the CLI without hardware.

[station]
name = "sim"
shutdown_order = ["Sim source - 1", "Sim source - 2", "Sim magnet - 1"]

[devices."Sim source - 1"]
driver = "sim_source"
limits = [-10.0, 10.0]
delay = 0.01

[devices."Sim source - 2"]
driver = "sim_source"
limits = [-1.0, 1.0]

[devices."Sim magnet - 1"]
driver = "sim_magnet"
limits = [-9.0, 9.0]
max_rate = 5.0

[devices."Sim lock-in - 1"]        # connect after the source it measures
driver = "sim_lockin"
source = "Sim source - 1"
gain = 1e-3
noise = 1e-6
