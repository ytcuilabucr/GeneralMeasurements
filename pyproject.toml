[project]
name = "sweepkit"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["numpy", "h5py", "pydantic>=2", "pyvisa", "pyvisa-py"]

[project.optional-dependencies]
xarray = ["xarray"]
plot = ["pyqtgraph", "PyQt6"]
dev = ["xarray", "pytest", "pytest-asyncio", "ruff"]

[project.scripts]
sweepkit = "sweepkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sweepkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
