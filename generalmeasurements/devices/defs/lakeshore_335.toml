# Lake Shore 335 temperature controller, one control loop.
#
# The driver never changes the loop's control input, PID or heater limits;
# they are shown read only.

drivers = ["lakeshore_335"]
label = "Lake Shore 335, loop {loop}"
info = "Reads input {input}; setpoint limits {limits[0]:g} … {limits[1]:g} K, max rate {max_rate:g} K/s."
safe = "Safe state: {safe_action} (hold: stop the setpoint ramp where it is; off: heater range Off)"
groups = ["Setpoint", "Heater"]

[properties.temperature]
key = ""
label = "{name} temperature (input {input})"
unit = "K"

[properties.setpoint]
access = "both"
group = "Setpoint"
label = "{name} loop {loop} setpoint"
unit = "K"
set = "set"                        # ramps, then waits until stable
readback = "temperature"
tolerance = "tolerance"
limits = "limits"
ramp = { max_rate = "max_rate", unit = "K/s", start = "start_ramp", stop = "hold" }

[properties.heater]
label = "{name} heater output"
unit = "%"

[properties.heater_range]
kind = "enum"
access = "both"
group = "Heater"
label = "Heater range"
choices = { Off = 0, Low = 1, Med = 2, High = 3 }
get = "get_heater_range"
set = "set_heater_range"
confirm = "Set the loop {loop} heater range to {value}?"
confirm_when = ["Low", "Med", "High"]

[properties.pid]
kind = "str"
group = "Heater"
label = "PID (read only)"
get = "snapshot.pid"

[properties.hold]
kind = "action"
label = "Hold setpoint"
set = "hold"
