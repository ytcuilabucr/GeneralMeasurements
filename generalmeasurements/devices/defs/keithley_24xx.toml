# Keithley 2400 / 2401 / 2410 / 2450 source-measure unit.
#
# The source function is a mode: keithley_24xx_volt.toml and
# keithley_24xx_curr.toml add the level and the compliance in their units.
# The model's hardware range stays in the driver (_Dialect); the station's
# limits narrow it.

drivers = ["keithley_24xx"]
label = "Keithley {d.model} SMU"
mode_attr = "mode"
modes = { volt = "Voltage source", curr = "Current source" }
attach = "sync"                    # adopt output state and level (queries only)
check_mode = "active_mode"         # the unit's present source function
switch = "switch_mode"
switch_confirm = """Switch {name} to {mode_label}?

The level ramps to 0 at max_rate and the output turns OFF. Then the unit is \
reset (*RST) and configured with the station's {mode} settings."""
switch_settings = ["compliance", "limits", "max_rate"]
read_if = "output"                 # with the output off the unit never replies to :READ?
safe = "Ramp the level to 0 at max_rate, then output OFF"
groups = ["Source", "Measure"]

[properties.output]
kind = "bool"
access = "both"
group = "Source"
label = "Output"
get = "output_on"
set = "set_output"
confirm = """Turn the output ON at level 0?

Only with a known load on the terminals."""
confirm_when = [true]
tooltip = "ON: level 0, then output on. OFF: ramp to 0 at max_rate, then output off."

[properties.v]
label = "{name} voltage"
unit = "V"

[properties.i]
label = "{name} current"
unit = "A"

[properties.in_compliance]
kind = "status"
key = "compliance"
label = "{name} in compliance (0/1)"
when = "check_compliance"

[properties.nplc]
label = "NPLC"
group = "Measure"
get = "nplc"
tooltip = "Integration time in power-line cycles, from the station"

[properties.configure]
kind = "action"
label = "Configure (reset)…"
set = "configure"
confirm = """Configure sends *RST: the output turns OFF and all settings return to \
the station's values. Continue?"""
