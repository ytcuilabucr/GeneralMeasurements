# Keithley 24xx sourcing voltage: the level is in V and reads back as `v`;
# the compliance limits the current.

mode = "volt"
info = "Sources voltage. Compliance {compliance:g} A; limits {limits[0]:g} … {limits[1]:g} V; max rate {max_rate:g} V/s."

[properties.level]
access = "both"
group = "Source"
label = "Voltage level"
unit = "V"
get = "programmed_level"
set = "set"                        # ramps at max_rate, then settles
readback = "v"
limits = "limits"
ramp = { max_rate = "max_rate", unit = "V/s" }
stoppable = true

[properties.compliance]
group = "Source"
label = "Current compliance"
unit = "A"
get = "compliance"
