# Stanford Research SR830 / SR850 lock-in amplifiers (same command set here).

drivers = ["sr830", "sr850"]
label = "SRS {model} lock-in"
safe = "Nothing hazardous: the reference keeps running"
groups = ["Settings", "Reference"]

[properties.x]
level = 0
label = "{name} X"
unit = "V"

[properties.y]
level = 0
label = "{name} Y"
unit = "V"

[properties.r]
level = 0
label = "{name} R"
unit = "V"

[properties.theta]
level = 0
label = "{name} phase"
unit = "deg"

[properties.sensitivity]
level = 0
kind = "enum"
access = "both"
group = "Settings"
label = "Sensitivity"
unit = "V"
choices_attr = "SENSITIVITY"
get = "get_sensitivity"
set = "set_sensitivity"

[properties.time_constant]
level = 0
kind = "enum"
access = "both"
group = "Settings"
label = "Time constant"
unit = "s"
choices_attr = "TIME_CONSTANT"
get = "get_time_constant"
set = "set_time_constant"

[properties.frequency]
level = 1
access = "both"
group = "Reference"
label = "Frequency"
unit = "Hz"
get = "snapshot.frequency"
set = "set_frequency"
min = 0.001                        # FREQ 0.001 … 102 000 Hz (manuals); internal reference only
max = 102000.0
tooltip = "Internal reference frequency. Refused while the lock-in follows an external reference; harmonic * frequency must stay ≤ 102 kHz"

[properties.amplitude]
level = 1
access = "both"
group = "Reference"
label = "Amplitude"
unit = "V"
get = "snapshot.amplitude"
set = "set_amplitude"
min = 0.004                        # SLVL 0.004 … 5.000 V rms (manuals)
max = 5.0
tooltip = "Sine output amplitude (V rms): the excitation of the sample"

[properties.phase]
level = 1
access = "both"
group = "Reference"
label = "Reference phase"
unit = "deg"
get = "snapshot.phase"
set = "set_phase"
min = -360.0                       # PHAS -360 … 729.99 (manuals); the unit wraps to ±180
max = 729.99
tooltip = "Phase shift of the reference; the lock-in shows it wrapped to ±180°"

[properties.idn]
level = 2
kind = "str"
group = "Reference"
label = "Identity"
get = "snapshot.idn"

[properties.auto_phase]
level = 1
kind = "action"
label = "Auto phase"
set = "auto_phase"
