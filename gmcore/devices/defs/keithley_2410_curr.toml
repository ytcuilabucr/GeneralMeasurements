# Keithley 2410 sourcing current: the level is in A and reads back as `i`;
# the compliance limits the voltage.

mode = "curr"
info = "Sources current. Compliance {compliance:g} V; limits {limits[0]:g} … {limits[1]:g} A."

# when switching into this mode, unless the station gives them
switch_defaults = { compliance = 1.0, limits = [-1e-6, 1e-6] }  # V; A

[properties.level]
level = 0
access = "both"
group = "Source"
label = "Current level"
unit = "A"
get = "programmed_level"
set = "set"                        # one step, then settles
readback = "i"
limits = "limits"

[properties.compliance]
level = 1
group = "Source"
label = "Voltage compliance"
unit = "V"
get = "compliance"

[properties.source_range]
level = 1
kind = "enum"
access = "both"
group = "Source"
label = "Current source range"
unit = "A"
choices_attr = "source_ranges"     # this model's ranges
allow_auto = true
get = "get_source_range"
set = "set_source_range"
interlock = "!output"              # a range change glitches the output
tooltip = "A fixed range gives finer resolution; the level must stay within 105 % of it. Changed only with the output off."

[properties.sense_range]
level = 1
kind = "enum"
access = "both"
group = "Measure"
label = "Voltage measure range"
unit = "V"
choices_attr = "sense_ranges"
allow_auto = true
get = "get_sense_range"
set = "set_sense_range"
tooltip = "Below the compliance, the output clamps at 105 % of this range (range compliance). Autorange never does."

[properties.effective_compliance]
level = 1
group = "Source"
label = "Effective compliance"
unit = "V"
get = "effective_compliance"
tooltip = "The compliance, or 105 % of a lower fixed measure range"
