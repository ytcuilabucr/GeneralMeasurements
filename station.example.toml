[station]
name = "bench"
shutdown_order = ["gate", "bias"]

[devices.gate]
driver = "keithley_24xx"
model = "2450"
resource = "GPIB0::18::INSTR"
compliance = 1e-9
limits = [-10.0, 10.0]
max_rate = 0.5

[devices.bias]
driver = "keithley_24xx"
model = "2400"
resource = "GPIB0::24::INSTR"
compliance = 1e-6
limits = [-1.0, 1.0]
max_rate = 0.1

[devices.dmm]
driver = "keithley_2000"
resource = "GPIB0::16::INSTR"
nplc = 10

[devices.lockin]
driver = "sr830"
resource = "GPIB0::8::INSTR"
frequency = 17.77
time_constant = 0.3
sensitivity = 1e-3
