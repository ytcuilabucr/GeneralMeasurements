name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      # the long name: in PowerShell "gm" is the Get-Member alias
      - run: generalmeasurements validate "Instrument config/lab.toml"
      - run: generalmeasurements validate "Instrument config/sim.toml"
      - run: generalmeasurements validate "Instrument config/example.toml"

  typecheck:
    # Report-only until the existing type errors are cleared (see CHANGELOG).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # the GUI packages too, so the GUI code is checked against PySide6's types
      - run: python -m pip install -e ".[dev,gui]"
      - run: pyright
